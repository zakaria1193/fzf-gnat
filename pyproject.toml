[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fzf-gnat"
version = "0.1.2"
description = "Fuzzy search Ada sources by unit name and krunched file name"
readme = "README.md"
authors = [{name = "Zakaria Fadli", email = "zakaria1193@gmail.com"}]
requires-python = ">=3.10"
dependencies = ["tree-sitter>=0.23", "tree-sitter-ada>=0.1"]

[project.optional-dependencies]
dev = ["pytest>=7"]
release = ["build>=1", "twine>=6"]

[project.scripts]
fzf-gnat = "fzf_gnat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
